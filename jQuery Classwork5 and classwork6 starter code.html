CW6 starter code

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CW6 – jQuery Events & Effects</title>
  <!-- jQuery CDN: paste the same script tag from CW5 -->
</head>
<body>

  <p id="message">I can appear and disappear!</p>

  <button id="btn-hide">Hide message</button>
  <button id="btn-show">Show message</button>
  <button id="btn-toggle">Toggle message</button>

  <script>
    $(document).ready(function () {

      // STEP 2: Hide #message when btn-hide is clicked
      $("#btn-hide").___(function () {
        $("#message").___();
      });

      // STEP 3: Show #message when btn-show is clicked
      $("#btn-show").___(function () {
        $("#message").___();
      });

      // STEP 4: Toggle #message when btn-toggle is clicked
      $("#btn-toggle").___(function () {
        $("#message").___();
      });

    });
  </script>

</body>
</html>
